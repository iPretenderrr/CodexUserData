<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Segoe UI','Microsoft YaHei UI',sans-serif;color:#ecf5ff;user-select:none;background:transparent}
.shell{position:relative;width:100%;height:100%;padding:14px 17px;border-radius:24px;background:linear-gradient(115deg,#111e30,#1e2945 62%,#203b48);border:1px solid #6da6d459;overflow:hidden;cursor:grab}
.shell:active{cursor:grabbing}.shell:before{content:'';position:absolute;width:100px;height:130px;right:15px;top:-75px;background:radial-gradient(ellipse,#61d6ed42,transparent 68%);pointer-events:none}
.top{display:flex;align-items:center;gap:7px;font-size:10px;color:#9fb6cc;letter-spacing:.6px}.dot{width:5px;height:5px;border-radius:50%;background:#7890a6}.active .dot{background:#69dfd1;box-shadow:0 0 10px #69dfd1}.back{margin-left:auto;color:#b7d1e7;background:#ffffff09;border:1px solid #ffffff1c;border-radius:8px;cursor:pointer;font:14px sans-serif;width:23px;height:21px}.back:hover{background:#ffffff22}
.body{display:flex;align-items:center;gap:14px;margin-top:5px}.tokens{font-size:26px;font-weight:650;letter-spacing:-.8px;line-height:32px;flex:1}.quotas{display:grid;gap:7px;width:106px}.row{display:flex;align-items:center;gap:5px;font-size:9px;color:#b9cede}.track{height:4px;background:#ffffff18;border-radius:5px;flex:1;overflow:hidden}.fill{position:relative;height:100%;background:linear-gradient(90deg,#5696ff,#71e6dc);border-radius:5px;transition:width .5s}.row:last-child .fill{background:linear-gradient(90deg,#7ca2ff,#e0b4ec)}.pct{width:27px;text-align:right}
.active .fill:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent,#ffffffbb,transparent);animation:flow 2.5s linear infinite}@keyframes flow{from{transform:translateX(-100%)}to{transform:translateX(100%)}}.eco .fill:after{animation-duration:5s}.off .fill{transition:none}.off .fill:after{animation:none}
@media(prefers-reduced-motion:reduce){.fill{transition:none}.active .fill:after{animation:none}}@media(max-width:220px){.quotas{display:none}.shell{padding:10px 14px}.body{margin:0}.tokens{font-size:23px}}
</style><div class="shell" id="shell"><div class="top"><span class="dot"></span>今日 TOKENS<button class="back" id="back" aria-label="返回主界面">↗</button></div><div class="body"><div class="tokens" id="tokens">—</div><div class="quotas" id="quotas"></div></div></div>
<script src="codexuserdata.js"></script><script>
const shell=document.getElementById('shell'),quotas=document.getElementById('quotas');
shell.addEventListener('pointerdown',e=>{if(e.button===0&&!e.target.closest('button'))CodexUserData.drag()});
document.getElementById('back').onclick=()=>CodexUserData.restoreMain();
CodexUserData.subscribe(data=>{
 document.getElementById('tokens').textContent=data.today?.tokenText??'—';
 shell.className='shell '+data.motion+(data.activity.activeTasks>0?' active':'');
 quotas.replaceChildren();
 for(const quota of data.quota.slice(0,2)){
  const row=document.createElement('div');row.className='row';
  const label=document.createElement('span');label.textContent=quota.minutes>=1440?Math.round(quota.minutes/1440)+'d':Math.round(quota.minutes/60)+'h';
  const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=(quota.remainingPercent??0)+'%';track.append(fill);
  const percent=document.createElement('span');percent.className='pct';percent.textContent=quota.remainingPercent==null?'—':Math.round(quota.remainingPercent)+'%';row.append(label,track,percent);quotas.append(row);
 }
});
</script></html>
